name = "love-button"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
FIREBASE_PROJECT_ID = "lovieapp-b4068"
PERSON_1_NAME = "Hubby"
PERSON_2_NAME = "Wifey"

[[d1_databases]]
binding = "DB"
database_name = "love-button"
database_id = "2bf232d6-01d3-4224-aa45-435433e10f60"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "TOKEN_CACHE"
id = "939528e726af44d2b7cd9eeb630e4a02"

[triggers]
# Daily retention sweep (spec 5.1): deletes sends rows older than 7 days.
# 03:17 UTC rather than on the hour — schedules at :00 cluster with everyone
# else's on the platform and are dispatched less promptly. The exact minute
# does not matter; the query is defined by a cutoff, not a cursor, so a late or
# skipped run simply deletes slightly more the next night.
crons = ["17 3 * * *"]
